<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Pernix</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/app-icon-192.png">
    <!-- Matches the mobile header (--bg-raised) and manifest.json theme_color;
         the meta tag is what the browser chrome actually reads. One per
         scheme, so "follow the system" is right with no script running at
         all; theme-boot.js rewrites both when the user has picked a theme
         explicitly. data-scheme is how it knows which is which. -->
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" data-scheme="dark">
    <meta name="theme-color" content="#f4f0e6" media="(prefers-color-scheme: light)" data-scheme="light">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pernix">
    <!-- Everything this page loads is served from this origin. The page holds
         a long-lived auth token (localStorage + a non-HttpOnly cookie), so any
         third-party script here would be able to read it — a CDN compromise or
         DNS hijack would be full account takeover, and the assets would be
         unavailable on the offline/LAN deployments this app targets anyway.
         The CSP below is what enforces that rather than leaving it to
         convention: a stray CDN <script> fails to execute instead of silently
         reintroducing the surface.
         'unsafe-inline' is required for style-src only — the el() helper sets
         style attributes at runtime and Monaco injects its own stylesheets.
         script-src carries no such escape hatch.
         connect-src and img-src are the second half of the story: the auth
         token is readable by JS, so these are what stop a hypothetical XSS
         from posting it to an attacker's host or smuggling it out in an
         image URL.
         frame-ancestors is deliberately absent — browsers ignore it (along
         with sandbox and report-uri) in a meta-tag policy, so listing it here
         would only look like clickjacking protection. That one has to be a
         real response header from the server. -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        font-src 'self';
        img-src 'self' data: blob:;
        connect-src 'self';
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
        form-action 'none'">
    <link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
    <!-- Vendored, not CDN-loaded: this app must work fully offline on a LAN.
         marked has no sanitizer of its own, so DOMPurify must be present
         before any markdown is rendered — render.js fails closed to plain text
         if it is missing. Monaco is served from /static/vendor/monaco (13MB);
         file-panel.js still falls back to a plain textarea if it fails. -->
    <script src="/static/vendor/marked.min.js"></script>
    <script src="/static/vendor/purify.min.js"></script>
    <script src="/static/vendor/monaco/vs/loader.js"></script>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/buttons.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/modals.css">
    <link rel="stylesheet" href="/static/css/jobs.css">
    <link rel="stylesheet" href="/static/css/file-panel.css">
    <!-- Two tiers, two gates, on purpose. compact.css answers "is the viewport
         narrower than 900px?" — a question every browser answers honestly, so
         its gate is a plain width query and no JavaScript touches it.
         touch.css answers "is the pointer a finger?", and THAT question a
         browser will lie about: iPadOS defaults to desktop-class browsing in
         Safari and Chrome alike (Chrome on iOS is WebKit), reporting
         `hover: hover`, `pointer: fine` and a layout width over 768px, so no
         media query can see an iPad. Its gate therefore lives HERE, on the
         link, instead of in an @media inside the file — touch-boot.js flips
         this one to media="all" when it finds an iPad. Never wrap touch.css's
         contents in an @media; that is exactly what breaks the tablet.
         touch.css loads last so it wins ties. -->
    <link rel="stylesheet" href="/static/css/compact.css"
          media="(max-width: 899px)">
    <link rel="stylesheet" href="/static/css/touch.css"
          media="(max-width: 768px), (hover: none) and (pointer: coarse)">
    <!-- Must come after that link (it mutates it) and stay in <head> so the
         switch happens before first paint — no flash of the desktop layout.
         A separate file rather than inline: the CSP above is `script-src
         'self'` with no 'unsafe-inline'. -->
    <script src="/static/js/touch-boot.js"></script>
    <!-- Same reasoning, for the same reason it cannot be inline: applies an
         explicit Dark/Light choice before the first paint. -->
    <script src="/static/js/theme-boot.js"></script>
    <!-- And again, for a dragged sidebar width: without it every load lays
         out at 270px and then animates to the stored number. -->
    <script src="/static/js/sidebar-boot.js"></script>
</head>
<body>
    <!-- First focusable thing on the page. Keyboard users otherwise tab through
         the whole session list, the legend and the status bar before reaching
         the one control they came for. Visually hidden until focused. -->
    <a class="skip-link" href="#msg-input">Skip to composer</a>
    <div id="app">
        <!-- Sidebar -->
        <nav id="sidebar" aria-label="Sessions">
            <header>
                <a class="brand" href="#" aria-label="Pernix">
                    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 2.2 L21.8 12 L12 21.8 L2.2 12 Z" fill="none" stroke="currentColor" stroke-width="0.9" opacity="0.95"></path>
                        <path d="M12 2.2 Q 13.2 10.8 21.8 12 Q 13.2 13.2 12 21.8 Q 10.8 13.2 2.2 12 Q 10.8 10.8 12 2.2 Z" fill="none" stroke="currentColor" stroke-width="0.7" opacity="0.85"></path>
                        <path d="M12 2.2 Q 14.4 9.6 21.8 12" fill="none" stroke="currentColor" stroke-width="0.45" opacity="0.55"></path>
                        <path d="M21.8 12 Q 14.4 14.4 12 21.8" fill="none" stroke="currentColor" stroke-width="0.45" opacity="0.55"></path>
                        <path d="M12 21.8 Q 9.6 14.4 2.2 12" fill="none" stroke="currentColor" stroke-width="0.45" opacity="0.55"></path>
                        <path d="M2.2 12 Q 9.6 9.6 12 2.2" fill="none" stroke="currentColor" stroke-width="0.45" opacity="0.55"></path>
                        <path d="M12 9.5 L14.5 12 L12 14.5 L9.5 12 Z" fill="none" stroke="currentColor" stroke-width="0.55" opacity="0.7"></path>
                    </svg>
                    <!-- The page's one h1. Styled exactly as the span it
                         replaced; it exists so the document has a top-level
                         heading at all. -->
                    <h1 class="brand-word">Pernix</h1>
                </a>
                <button id="new-session-btn">+ new</button>
            </header>
            <div id="session-list"></div>
        </nav>
        <!-- The sidebar's own right edge, as a control. Outside the <nav>
             rather than in it: #sidebar is `overflow: hidden` and `position:
             static`, and making it a containing block to hold this would move
             the desktop layout. sidebar.js arms the drag; layout.css pins it
             to calc(var(--sidebar-w) - 3px) and hides it when the sidebar is
             collapsed, touch.css and compact.css when there is no mouse or no
             room. -->
        <div id="sidebar-resizer" role="separator" aria-orientation="vertical"
             aria-label="Resize sidebar" tabindex="0"></div>

        <!-- Main -->
        <main id="main">
            <button id="sidebar-toggle" title="Toggle sidebar" aria-label="Toggle sidebar"><svg class="pxi pxi-menu" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/></svg></button>
            <!-- Wayfinding. The session list is not always on screen — it can be
                 collapsed on desktop and is a drawer on a phone — so nothing in
                 the main pane said which conversation you were reading. Hidden
                 on the empty state (app.js). -->
            <header id="session-header" hidden>
                <span class="space-chip-labeled" id="session-header-space" hidden></span>
                <button type="button" id="session-header-title" class="session-header-title"></button>
            </header>
            <!-- role=region, not role=log: a log region turns every appended
                 node into an automatic announcement, so during a streaming
                 turn a screen reader narrates the model token by token. -->
            <div id="messages" role="region" aria-label="Conversation">
                <div class="messages-inner" id="messages-inner"></div>
            </div>
            <button id="jump-to-bottom" title="Jump to latest" aria-label="Jump to latest"><svg class="pxi pxi-arrow-down" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4v15.5"/><path d="M5.5 13L12 19.5 18.5 13"/></svg></button>
            <div id="worker-strip" hidden></div>
            <div id="status-bar">
                <span id="sse-health" class="sse-health disconnected" title="SSE: disconnected"></span>
                <!-- Both of these open something on click. As spans they were
                     invisible to the keyboard and announced as plain text, so
                     the model switcher and the state timeline were mouse-only. -->
                <button type="button" class="model" id="status-model"
                        aria-haspopup="menu" aria-expanded="false">...</button>
                <span class="ctx" id="status-ctx"></span>
                <button type="button" id="state-badge" class="state-badge idle_ready"
                        aria-haspopup="dialog"
                        title="Session state — click for timeline">idle</button>
                <button id="pause-btn" class="status-btn" title="Pause after the current step" aria-label="Pause after the current step" hidden><svg class="pxi pxi-pause" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9.5 5v14"/><path d="M14.5 5v14"/></svg></button>
                <span id="browser-status"></span>
                <span id="tool-status"></span>
                <span class="info" id="status-info"></span>
                <!-- Separate from #status-info on purpose: a notice ("reconnected
                     — transcript refreshed") outlives the transient status line,
                     and any updateStatus('') used to wipe it mid-read. -->
                <span class="notice" id="status-notice"></span>
                <span class="status-divider" aria-hidden="true"></span>
                <button id="notification-bell" class="status-btn" title="Notifications" aria-label="Notifications"><span class="bell-icon"><svg class="pxi pxi-bell" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M10.3 19.5a2 2 0 0 0 3.4 0"/></svg></span><span class="bell-badge" id="bell-badge">0</span></button>
                <button id="copy-transcript-btn" class="status-btn" title="Copy transcript" aria-label="Copy transcript"><svg class="pxi pxi-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M6 15H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"/></svg></button>
                <button id="export-transcript-btn" class="status-btn" title="Download transcript as Markdown" aria-label="Download transcript as Markdown"><svg class="pxi pxi-download" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3.5v11.5"/><path d="M7.5 11l4.5 4.5 4.5-4.5"/><path d="M4.5 20.5h15"/></svg></button>
                <!-- The two buttons that open a whole surface get a word
                     beside the icon once there is room for one (>=900px):
                     "Explorer" and "Settings" are not guessable from a folder
                     and a cog, and these are where everything configurable
                     lives. The glyphs they replaced were &#128193; — a colour
                     EMOJI in a monochrome status bar — and &#9881;. -->
                <button id="files-btn" class="status-btn" title="Explorer — files, skills, memory, jobs" aria-label="Explorer"><svg class="pxi pxi-folder" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 6.5a2 2 0 0 1 2-2h3.6l2 2.4h7.4a2 2 0 0 1 2 2v9.6a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg><span class="status-btn-label">Explorer</span></button>
                <button id="settings-btn" class="status-btn" title="Settings" aria-label="Settings"><svg class="pxi pxi-settings" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="status-btn-label">Settings</span></button>
            </div>
            <!-- The composer. #input-wrapper is the group; #composer is the
                 card, and its state classes — .is-focused, .is-multiline,
                 .is-streaming, .is-rest-inline — are set in app.js and are what
                 every layout rule keys off. Text on top, controls beneath, so
                 the writing area gets the full width and the targets get their
                 platform size. docs/dev/composer-plan.md is the contract this
                 shares with the expand editor. -->
            <div id="input-wrapper" role="group" aria-label="Message composer">
                <!-- Above the chips, not inside the card: it is about the turn
                     that is already running, not about what you are typing
                     next. app.js fills and clears it. -->
                <div id="queued-chip" hidden></div>
                <div id="file-chips"></div>
                <div id="composer">
                    <input type="file" id="attach-input" multiple hidden>
                    <!-- The placeholder is not a label: it disappears the moment
                         you type, and several screen readers never read it at
                         all. The one control the whole app exists for was
                         announced as "edit text, blank". The key binding lives
                         in #composer-hint and in aria-description now — a
                         placeholder that carries it runs off the end of the
                         box at any realistic width. -->
                    <textarea id="msg-input" placeholder="Message Pernix…" rows="2"
                              aria-label="Message Pernix"></textarea>
                    <!-- Long-paste offer. Hidden until a paste crosses the
                         threshold; app.js writes the sentence and wires the
                         two buttons. -->
                    <div id="composer-banner" hidden>
                        <span id="banner-text"></span>
                        <span class="banner-actions">
                            <button id="banner-attach" type="button">Attach as a file</button>
                            <button id="banner-keep" type="button">Keep it here</button>
                        </span>
                    </div>
                    <div id="composer-row">
                        <!-- Stop is its own act, so it is its own button:
                             sharing a slot with Send meant the control under
                             your cursor changed meaning mid-turn. -->
                        <button id="stop-btn" type="button" title="Stop the agent" aria-label="Stop the agent" hidden>
                            <svg class="pxi pxi-stop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true" focusable="false">
                                <rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"></rect>
                            </svg>
                        </button>
                        <button id="attach-btn" type="button" title="Attach files" aria-label="Attach files">
                            <svg class="pxi pxi-attach" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                            </svg>
                        </button>
                        <!-- Hidden until the expand editor module is loaded
                             (app.js re-checks lazily) — a control that opens
                             nothing is worse than no control. -->
                        <button id="expand-btn" type="button" title="Open a larger editor" aria-label="Open a larger editor" hidden>
                            <svg class="pxi pxi-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M9.5 4.5H4.5V9.5"></path>
                                <path d="M14.5 4.5h5v5"></path>
                                <path d="M9.5 19.5H4.5v-5"></path>
                                <path d="M14.5 19.5h5v-5"></path>
                            </svg>
                        </button>
                        <!-- Hidden until /api/voice/status says a mode is configured (Settings → Integrations → Voice Input) -->
                        <button id="voice-btn" type="button" title="Voice input — tap to toggle, hold to talk (Ctrl+Shift+M)" aria-label="Voice input" hidden>
                            <svg class="pxi pxi-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M12 1.5a3 3 0 0 0-3 3v7.5a3 3 0 0 0 6 0V4.5a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10.5V12a7 7 0 0 1-14 0v-1.5"></path>
                                <path d="M12 19v3.5"></path>
                                <path d="M8.5 22.5h7"></path>
                            </svg>
                        </button>
                        <span class="grow" aria-hidden="true"></span>
                        <span id="composer-count" hidden></span>
                        <!-- A button, not a caption: clicking it flips the
                             Enter binding in place, which is the setting two
                             menus away that nobody found. -->
                        <button id="composer-hint" type="button"></button>
                        <button id="send-btn" type="button" title="Send message" aria-label="Send message">
                            <svg class="pxi pxi-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                                <path d="M22 2L11 13"></path>
                                <path d="M22 2l-7 20-4-9-9-4z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- File panel -->
        <div id="file-panel"></div>
    </div>

    <!-- Screen-reader announcement channels (a11y.js writes here). Two, so a
         routine "Saved" cannot interrupt an error the user has to act on. -->
    <div id="a11y-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
    <div id="a11y-live-assertive" class="visually-hidden" aria-live="assertive" aria-atomic="true"></div>

    <script src="/static/js/pwa.js"></script>
    <!-- The composer's expand editor. Its own module <script> rather than an
         import inside app.js, because the arrow only ever points one way: the
         composer calls the editor, the editor never calls the composer. It
         publishes window.PernixComposeEditor on load; app.js reads that global
         when #expand-btn is pressed. Both are modules, so they share one
         registry and one copy of a11y.js's overlay stack. -->
    <script type="module" src="/static/js/components/compose-editor.js"></script>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
